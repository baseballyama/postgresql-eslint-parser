# Temporary verification for #264, not for merge: runs eslint-plugin-postgresql's
# full test suite against the parser built from main (baseline) and from the PR head.
name: tmp-264-diag3
on:
  push:
    branches: [verify/parser-264-diag3-080a4cc]
permissions:
  contents: read
jobs:
  plugin-tests:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        parser: [main, head]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.parser == 'main' && 'main' || github.sha }}
          path: parser
      - uses: actions/checkout@v7
        with:
          repository: baseballyama/eslint-plugin-postgresql
          ref: main
          path: plugin
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: parser/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and pack the parser
        working-directory: parser
        run: |
          git log --oneline -1
          pnpm install --frozen-lockfile
          pnpm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the plugin and swap in the packed parser
        working-directory: plugin
        run: |
          git log --oneline -1
          npx -y pnpm@12.9.1 install --frozen-lockfile
          dir=$(realpath node_modules/postgresql-eslint-parser)
          rm -rf "$dir"/*
          tar -xzf "$RUNNER_TEMP"/postgresql-eslint-parser-*.tgz -C "$dir" --strip-components=1
          grep '"version"' "$dir/package.json"
      # Results are compared in the diff job; a red head run here is expected
      # whenever the parser changes what a plugin fixture asserts.
      - name: Plugin tests
        working-directory: plugin
        env:
          NO_COLOR: "1"
        run: |
          set +e
          npx -y pnpm@12.9.1 exec vitest run --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
          echo "exit=$?" > "$RUNNER_TEMP/exit-${{ matrix.parser }}.txt"
          node -e '
            const r = require(process.argv[1]);
            const rows = r.testResults.flatMap(f => f.assertionResults.map(a => `${a.status}\t${f.name.split("/plugin/")[1]} > ${a.fullName}`));
            require("fs").writeFileSync(process.argv[2], rows.sort().join("\n") + "\n");
            for (const f of r.testResults) for (const a of f.assertionResults) if (a.status !== "passed") console.log(`${a.status}: ${a.fullName}\n${a.failureMessages.join("\n").slice(0, 1500)}`);
            console.log(`total ${r.numTotalTests}, passed ${r.numPassedTests}, failed ${r.numFailedTests}`);
          ' "$RUNNER_TEMP/vitest.json" "$RUNNER_TEMP/results-${{ matrix.parser }}.txt"
          cat "$RUNNER_TEMP/exit-${{ matrix.parser }}.txt"
      # Diagnostic only: shows exactly which fixture expectations the parser
      # under test changes. Nothing is committed to the plugin.
      - name: Fixture differences under this parser
        if: matrix.parser == 'head'
        working-directory: plugin
        run: |
          npx -y pnpm@12.9.1 run update-fixtures >/dev/null 2>&1 || true
          npx -y pnpm@12.9.1 exec prettier --write tests/fixtures >/dev/null 2>&1 || true
          git diff --stat -- tests
          git diff -- tests | tee "$RUNNER_TEMP/fixture-diff.patch"
      - name: Plugin type check
        working-directory: plugin
        run: npx -y pnpm@12.9.1 run type:check
      - name: Lint the playground's default example and the Prisma input
        working-directory: plugin
        shell: bash -eo pipefail {0}
        run: |
          cat > tests/tmp-diag.test.ts <<'TS'
          // Diagnostic only (not committed): prints what the plugin reports, through
          // the same src + parser path the plugin's own tests use.
          import { readFileSync } from "node:fs";
          import { Linter } from "eslint";
          import postgresqlParser from "postgresql-eslint-parser";
          import { it } from "vitest";
          import plugin from "../src/index.js";
          const show = (label: string, code: string, messages: Linter.LintMessage[]) => {
            const lines = code.split("\n");
            for (const m of messages) console.log(`${label} ${m.line}:${m.column}-${m.endLine}:${m.endColumn} ${m.ruleId} | ${JSON.stringify(lines[m.line - 1]?.slice(m.column - 1, m.column + 19))}`);
            console.log(`${label} messages ${messages.length}`);
          };
          it("diagnostics", () => {
            const src = readFileSync("site/src/lib/data/examples.ts", "utf8");
            const example = src.match(/DEFAULT_EXAMPLE = `([\s\S]*?)`;/)![1]!;
            const recommended = plugin.configs!.recommended as Linter.Config;
            const sqlConfig: Linter.Config = { files: ["**/*.sql"], plugins: { postgresql: plugin }, languageOptions: { parser: postgresqlParser }, rules: recommended.rules };
            show("EXAMPLE", example, new Linter({ configType: "flat" }).verify(example, [sqlConfig], "example.sql"));
            const prisma = ["const rows = await prisma.$queryRaw`SELECT * FROM users`;", "await prisma.$executeRaw`DELETE FROM sessions`;"].join("\n");
            const config: Linter.Config[] = [
              { files: ["**/*.ts"], processor: plugin.processors!["embedded-sql"]! },
              { files: ["**/*.sql"], plugins: { postgresql: plugin }, languageOptions: { parser: postgresqlParser }, rules: { "postgresql/no-select-star": "error", "postgresql/require-where-in-delete": "error" } },
            ];
            show("PRISMA", prisma, new Linter({ configType: "flat" }).verify(prisma, config, { filename: "db.ts", filterCodeBlock: (f) => f.endsWith(".sql") }));
          });
          TS
          npx -y pnpm@12.9.1 exec vitest run tests/tmp-diag.test.ts --reporter=verbose 2>&1 | grep -E "^(EXAMPLE|PRISMA)|✓|×|Error" | tee "$RUNNER_TEMP/diag-${{ matrix.parser }}.txt"
          test -s "$RUNNER_TEMP/diag-${{ matrix.parser }}.txt"
          grep -q "messages" "$RUNNER_TEMP/diag-${{ matrix.parser }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-results-${{ matrix.parser }}
          path: |
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/vitest.json
  diff:
    timeout-minutes: 25
    needs: plugin-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: plugin-results-*
          merge-multiple: true
      - name: Differences between main and head
        run: |
          wc -l results-*.txt; cat exit-*.txt
          test -s results-main.txt && test -s results-head.txt
          diff results-main.txt results-head.txt && echo "no differences" || true
          echo "--- diagnostics: main vs head"
          diff diag-main.txt diag-head.txt || true
          echo "--- head"; cat diag-head.txt

