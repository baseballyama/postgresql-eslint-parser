# Temporary verification for #264, not for merge: runs eslint-plugin-postgresql's
# full test suite against the parser built from main (baseline) and from the PR head.
name: tmp-plugin-integration
on:
  push:
    branches: [verify/plugin-integration]
permissions:
  contents: read
jobs:
  plugin-tests:
    strategy:
      fail-fast: false
      matrix:
        parser: [main, head]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.parser == 'main' && 'main' || github.sha }}
          path: parser
      - uses: actions/checkout@v6
        with:
          repository: baseballyama/eslint-plugin-postgresql
          ref: main
          path: plugin
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: parser/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build and pack the parser
        working-directory: parser
        run: |
          git log --oneline -1
          pnpm install --frozen-lockfile
          pnpm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the plugin and swap in the packed parser
        working-directory: plugin
        run: |
          git log --oneline -1
          npx -y pnpm@11.22.0 install --frozen-lockfile
          dir=$(realpath node_modules/postgresql-eslint-parser)
          rm -rf "$dir"/*
          tar -xzf "$RUNNER_TEMP"/postgresql-eslint-parser-*.tgz -C "$dir" --strip-components=1
          grep '"version"' "$dir/package.json"
      # Results are compared in the diff job; a red head run here is expected
      # whenever the parser changes what a plugin fixture asserts.
      - name: Plugin tests
        working-directory: plugin
        env:
          NO_COLOR: "1"
        run: |
          set +e
          npx -y pnpm@11.22.0 exec vitest run --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
          echo "exit=$?" > "$RUNNER_TEMP/exit-${{ matrix.parser }}.txt"
          node -e '
            const r = require(process.argv[1]);
            const rows = r.testResults.flatMap(f => f.assertionResults.map(a => `${a.status}\t${f.name.split("/plugin/")[1]} > ${a.fullName}`));
            require("fs").writeFileSync(process.argv[2], rows.sort().join("\n") + "\n");
            for (const f of r.testResults) for (const a of f.assertionResults) if (a.status !== "passed") console.log(`${a.status}: ${a.fullName}\n${a.failureMessages.join("\n").slice(0, 1500)}`);
            console.log(`total ${r.numTotalTests}, passed ${r.numPassedTests}, failed ${r.numFailedTests}`);
          ' "$RUNNER_TEMP/vitest.json" "$RUNNER_TEMP/results-${{ matrix.parser }}.txt"
          cat "$RUNNER_TEMP/exit-${{ matrix.parser }}.txt"
      - name: Plugin type check
        working-directory: plugin
        run: npx -y pnpm@11.22.0 run type:check
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-results-${{ matrix.parser }}
          path: |
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/vitest.json
  diff:
    needs: plugin-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: plugin-results-*
          merge-multiple: true
      - name: Differences between main and head
        run: |
          wc -l results-*.txt; cat exit-*.txt
          test -s results-main.txt && test -s results-head.txt
          diff results-main.txt results-head.txt && echo "no differences" || true

  # What a user gets from a fresh install today (no lockfile), per package manager.
  fresh-consumer:
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn]
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Fresh install of the published plugin
        working-directory: ${{ runner.temp }}
        run: |
          mkdir app && cd app && echo '{"name":"app","private":true,"type":"module"}' > package.json
          case "${{ matrix.pm }}" in
            npm) npm install eslint@10 eslint-plugin-postgresql@0.24.0 ;;
            pnpm) npx -y pnpm@11 add eslint@10 eslint-plugin-postgresql@0.24.0 ;;
            yarn) corepack enable && yarn set version stable && printf 'nodeLinker: node-modules\n' >> .yarnrc.yml && yarn add eslint@10 eslint-plugin-postgresql@0.24.0 ;;
          esac
      - name: Import and lint
        working-directory: ${{ runner.temp }}/app
        run: cp "$GITHUB_WORKSPACE/.github/tmp-consumer/check.mjs" . && node check.mjs
  # The same consumer with the #264 parser, on each @libpg-query/parser 17.x a fresh install can pick.
  fixed-parser-consumer:
    strategy:
      fail-fast: false
      matrix:
        libpg: [17.6.10, 17.7.0, 17.8.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build and pack the parser
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the published plugin with the packed parser
        working-directory: ${{ runner.temp }}
        run: |
          mkdir app && cd app
          tgz=$(ls "$RUNNER_TEMP"/postgresql-eslint-parser-*.tgz)
          cat > package.json <<JSON
          {"name":"app","private":true,"type":"module",
           "overrides":{"postgresql-eslint-parser":"file:$tgz","@libpg-query/parser":"${{ matrix.libpg }}"}}
          JSON
          npm install eslint@10 eslint-plugin-postgresql@0.24.0
      - name: Import and lint
        working-directory: ${{ runner.temp }}/app
        run: cp "$GITHUB_WORKSPACE/.github/tmp-consumer/check.mjs" . && node check.mjs
  # Baseline for the matrix above: the published parser 0.5.4 pinned to each 17.x.
  published-parser-consumer:
    strategy:
      fail-fast: false
      matrix:
        libpg: [17.6.10, 17.7.0, 17.8.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install the published plugin and parser
        working-directory: ${{ runner.temp }}
        run: |
          mkdir app && cd app
          echo '{"name":"app","private":true,"type":"module","overrides":{"@libpg-query/parser":"${{ matrix.libpg }}"}}' > package.json
          npm install eslint@10 eslint-plugin-postgresql@0.24.0
      - name: Import and lint
        working-directory: ${{ runner.temp }}/app
        run: cp "$GITHUB_WORKSPACE/.github/tmp-consumer/check.mjs" . && node check.mjs
