# Temporary, not for merge: regenerates the lockfile for build/docs-kit3, runs
# the quality gate, and compares the docs site built from build/deps-latest
# (before) and build/docs-kit3 (after) with the Pages environment.
name: tmp-docs-kit3
on:
  push:
    branches: [verify/parser-docs-kit3]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate the lockfile
        run: |
          pnpm install --no-frozen-lockfile
          git diff --stat -- pnpm-lock.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: docs-kit3-lockfile
          path: pnpm-lock.yaml
      - name: Quality gate
        run: pnpm check:all
      - name: Tests
        run: pnpm test
      - name: Docs type check
        working-directory: docs
        run: pnpm check
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: after
      - uses: actions/checkout@v7
        with:
          ref: build/deps-latest
          path: before
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: after/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build both sites as deploy-docs.yml does
        env:
          NODE_ENV: production
          BASE_PATH: /postgresql-eslint-parser
        run: |
          (cd before && pnpm install --frozen-lockfile && cd docs && pnpm build)
          (cd after && pnpm install --no-frozen-lockfile && cd docs && pnpm build)
          for v in before after; do echo "== $v"; (cd $v/docs/build && find . -type f | grep -v _app/immutable | sort); done
      - name: Docs type check on both
        run: |
          set +e
          (cd before/docs && pnpm check > "$RUNNER_TEMP/check-before.txt" 2>&1; echo "before exit $?")
          (cd after/docs && pnpm check > "$RUNNER_TEMP/check-after.txt" 2>&1; echo "after exit $?")
          tail -3 "$RUNNER_TEMP/check-before.txt"; echo ---; tail -3 "$RUNNER_TEMP/check-after.txt"
      - name: Capture and compare
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/after/.github/tmp-docs/shots.mjs" .
          node shots.mjs "$GITHUB_WORKSPACE/before/docs/build" "$GITHUB_WORKSPACE/after/docs/build" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-shots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/check-*.txt
